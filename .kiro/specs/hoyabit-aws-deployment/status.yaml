# 緊急切線（時間嚴重不足時的取捨順序）
emergency_cut_line:
  must_do: [D0, D1, D2, D3, D5]
  skippable:
    - task: D4
      cost: 雲端可能降級為 offline fallback，必須誠實標示，不得宣稱 live 成功
    - task: D6
      cost: 產物只在容器 /tmp，必須標示為暫存
  minimise:
    - task: D7
      keep: reserved concurrency
      defer: [log retention, Budgets 告警]
  final_fallback: >-
    連 D5 都無法完成時改以本機 Demo 展示，使用
    demo-fixtures/competition-ready/offline-backup/ 與 comparison-backup/，
    並把 D 任務整體標記為 BLOCKED，附上實際卡點。
  always_do: [D9]               # 避免遺留計費資源
