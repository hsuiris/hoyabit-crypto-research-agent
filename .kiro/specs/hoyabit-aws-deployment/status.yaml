# 本機驗證環境（實測，非推定）
environment:
  aws_cli: aws-cli/2.36.2 Python/3.14.6 Darwin/23.4.0
  python_command: python3       # 版本 3.9.6，低於專案要求的 3.10+
  boto3: 1.42.97                # ~/Library/Python/3.9；bedrock-runtime 含 Converse operation
  pwsh: absent                  # aws/deploy.ps1 無法在本機執行，故需 D3 的 deploy.sh
  aws_credentials: absent       # aws sts get-caller-identity → NoCredentials (exit 253)
  aws_region_configured: false

full_suite_command: python3 -m unittest discover -s tests
full_suite_baseline: 581 tests, 581 passed, 0 failed, 0 errors   # D4 +14, D5 +15, D7 +11

allowed_statuses:
  - TODO
  - READY
  - IN_PROGRESS
  - REVIEW
  - PASS
  - FAIL
  - BLOCKED
  - PARTIAL

executors:
  HUMAN: 只能由帳號持有者在 AWS Console 或本機終端執行
  KIRO: Kiro 可直接完成，產出程式碼或文件
  BOTH: Kiro 準備命令與檔案，由人執行並回報輸出

rules:
  one_task_at_a_time: true
  require_dependency_pass: true
  require_full_test_suite: true
  require_commit: true          # HUMAN-only 任務例外，見各 task 的 commit 欄位
  auto_start_next_task: false
  blocker_timebox_minutes: 20
  blocker_document: docs/COMPETITION_BLOCKERS.md
  minimum_demonstrable_task: D5
  # D0-D7 不得修改 docs/COMPETITION_TASK_STATUS.yaml；該檔屬於
  # hoyabit-competition-ready spec，只有 D8 回寫其中的 T8。
  cross_spec_writeback_task: D8
  # 任何 D 任務都不得刪除 deterministic offline fallback、六項提交物或既有備案 fixture。
  protect_offline_fallback: true
  protect_demo_fixtures: true

# 部署變數。
#
# 這個 repository 是公開的，因此以下欄位一律使用佔位符，不寫入真實值：
#   <ACCOUNT_ID>          AWS 帳號 ID
#   <FUNCTION_URL_HOST>   Lambda Function URL 的主機名
#
# Function URL 特別不能公開：它的 AuthType 是 NONE，任何取得網址的人都能觸發完整
# 研究執行並消耗 Bedrock 配額。帳號 ID 雖然不是密鑰，但公開它沒有好處。
#
# 需要實際值時從 AWS 取得，不要回填進本檔：
#   aws sts get-caller-identity --query Account --output text
#   aws cloudformation describe-stacks --region <REGION> --stack-name hoyabit-agent-mvp \
#     --query "Stacks[0].Outputs[?OutputKey=='PublicUrl'].OutputValue" --output text
#
# 憑證（access key、secret、session token）在任何情況下都不得寫入本檔或任何版控檔案。
deployment_parameters:
  account_id: '<ACCOUNT_ID>'    # AWS Workshop Studio 臨時帳號（非機密）
  region: us-west-2             # 競賽環境指定；已實測 Bedrock 可呼叫
  model_id: amazon.nova-lite-v1:0
  model_id_form: foundation_model    # 裸 ID 即可，不需 inference profile
  stack_name: hoyabit-agent-mvp
  function_name: hoyabit-market-research-agent
  function_url: https://<FUNCTION_URL_HOST>/
  deploy_bucket: hoyabit-agent-deploy-<ACCOUNT_ID>-us-west-2
  artifact_bucket: null         # D6 才建立，未做則保持 null

# 環境約束：Workshop Studio 帳號既有資源，不可動用或覆寫。
environment_constraints:
  caller_arn: arn:aws:sts::<ACCOUNT_ID>:assumed-role/WSParticipantRole/Participant
  credentials_lifetime: 臨時憑證，活動結束或數小時後失效；部署後應盡快存證
  do_not_touch:
    - WSParticipantRole                      # 目前使用的參與者角色
    - WSLambdaCurtailerRole                  # Workshop 的 Lambda 併發抑制角色
    - WSConcurrencyCurtailer-DO-NOT-USE      # Lambda，名稱明示不可使用
  note: >-
    WSConcurrencyCurtailer 的存在說明環境會監控並限制 Lambda 併發，
    因此 D7 設定 reserved concurrency 時不可假設能取用帳號全部併發額度。

