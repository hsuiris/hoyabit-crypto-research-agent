    requirements: [5.1, 5.2, 5.3, 5.4, 5.5, 5.6]
    design_decision: D-3
    commit: 'fix(D5): deploy to aws and repair bedrock json fence and run observability'
    milestone: 最小可展示雲端路徑（已達成）
    deployed:
      stack_status: CREATE_COMPLETE
      function_url: https://<FUNCTION_URL_HOST>/
      deploy_bucket: hoyabit-agent-deploy-<ACCOUNT_ID>-us-west-2
      package_size: 377 KB 壓縮 / 1.2 MB 解壓（Lambda 上限 250 MB）
      lambda_botocore: 1.42.97（內建即支援 Converse，因此未啟用 --bundle-sdk）
    in_scope:
      - 部署執行
      - src/llm.py（範圍擴充，見 scope_extension）
      - lambda_handler.py（執行摘要 log）
      - tests/test_d5_bedrock_json_fence.py（新增）
      - aws/README.md（us-west-2 的 Binance 限制）
    out_of_scope:
      - src/orchestrator.py（未改動）
      - 新增 AWS 資源（D6／D7 的事）
    scope_extension:
      what: 修改 src/llm.py 與 lambda_handler.py，原本不在 D5 的 in_scope。
      why: >-
        首次部署技術上成功（stack CREATE_COMPLETE、GET 200、六檔齊備、manifest hash 全相符），
        但 planner／analyst／critic 三個階段全部是 fallback:ValueError——模型路徑完全沒跑。
        部署成功而模型不通，不能算 D5 驗收通過，因此修復屬於達成 D5 目標的必要工作而非額外功能。
      root_cause: >-
        amazon.nova-lite-v1:0 在 Converse 下會把 JSON 包成 markdown code fence
        （```json ... ```），src/llm.py 直接 json.loads() 因此拋
        JSONDecodeError: Expecting value: line 1 column 1 (char 0)，且既有的單次重試無效
        ——模型行為一致，重試只會拿到同一個 fence。已在本機用同一模型重現，錯誤訊息與雲端一字不差。
        根因是 Converse 沒有等同 Gemini response_mime_type 或 OpenAI response_format 的
        強制 JSON 模式，所以模型可自行決定輸出格式。
      fix: >-
        新增 src.llm.strip_json_fence() 只剝除最外層 fence，並在 prompt 明確要求不要使用
        code fence（prompt 是請求不是保證，因此程式端仍必須容錯）。Gemini／OpenAI 走各自的
