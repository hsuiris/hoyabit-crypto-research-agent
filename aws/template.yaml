AWSTemplateFormatVersion: '2010-09-09'
Description: HOYA BIT crypto market research Agent MVP

Parameters:
  CodeBucket:
    Type: String
  CodeKey:
    Type: String
  LLMSecretArn:
    Type: String
    Default: ''
  LLMProvider:
    Type: String
    Default: gemini
    AllowedValues: [bedrock, gemini, openai, none]
  GeminiModel:
    Type: String
    Default: gemini-3.6-flash
  OpenAIModel:
    Type: String
    Default: gpt-4o-mini
  FunctionUrlAuthType:
    Type: String
    Default: NONE
    AllowedValues: [NONE, AWS_IAM]
    # NONE 讓評審不需要憑證就能開啟 Demo，這是刻意的取捨；代價是任何取得 URL 的人都能
    # 觸發完整執行並消耗 Bedrock 配額。要收斂暴露面時改成 AWS_IAM，公開叫用權限會一併移除。
  ReservedConcurrency:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 10
    # 公開端點的成本天花板。上限刻意設為 10：本帳號的 UnreservedConcurrentExecutions 只有
    # 110，而 AWS 要求設定 reserved concurrency 後帳號仍須保留至少 100 unreserved，
    # 因此可保留的額度最多就是 10。環境中另有 WSConcurrencyCurtailer 機制在管併發，
    # 不要假設可以自由取用帳號額度。
  LogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 5, 7, 14, 30]
    # 不使用永久保留：Demo 用的 log 沒有長期價值，卻會持續產生儲存費用。
  CodeCommit:
    Type: String
    Default: ''
    # 部署時打包的 git commit。Lambda 套件裡沒有 .git，`run_context._code_commit()` 因此
    # 只能回 unknown，manifest 的 code_commit 也就一直是 unknown —— 於是「這個 Function URL
    # 現在跑的是哪一版程式」無法從產物本身回答。部署時注入才能讓它可驗證，這對「主辦方抽查
    # 可回溯性」與「demo 前確認修好的程式已經上線」都是必要的。
  BedrockModelId:
    Type: String
    # A same-region foundation model ID: keep this in sync with the Lambda deployment region.
    # Verified 2026-08-01 in us-west-2 (the deployment Region): this model supports ON_DEMAND,
    # so the bare foundation model ID works with Converse and no cross-Region inference profile
    # is required.  Model availability differs per Region and this has been observed, not just
    # assumed: amazon.nova-micro-v1:0 accepts the bare ID in us-east-1 but rejects it in
    # us-west-2.  Re-run aws/verify-permissions.sh before changing Region.
    Default: amazon.nova-lite-v1:0
  BedrockMaxTokens:
    Type: Number
    Default: 5000
    MinValue: 512
    MaxValue: 5000
    # Converse 的輸出上限，對應 Lambda 的 BEDROCK_MAX_TOKENS 環境變數。
    #
    # 這個參數必須存在，不是調校用的旋鈕：沒有它，Lambda 的環境變數就不含
    # BEDROCK_MAX_TOKENS，src/llm.py 只能吃程式內建預設值，而 .env 不會進部署包 ——
    # 因此雲端完全沒有辦法調整輸出上限。
    #
    # 撞到上限時 Converse 不會報錯，而是回 stopReason=max_tokens 並把 JSON 截在一半，
    # 於是整份分析靜靜降級成離線推理，報告照樣產出。E2 之後每筆 Evidence 的語意評估併進
    # 同一次分析回應，輸出長度因此逼近上限，這條路變成實際風險而非理論風險。
    #
    # MaxValue 5000 對齊上方 BedrockModelId 預設模型的文件輸出上限
    # （amazon.nova-lite-v1:0：context window 300K、max output tokens 5K）。
    # 換成輸出上限更大的模型要一併調高；更小的則必須調低，否則 Converse 會拒絕請求。

Conditions:
  # AuthType NONE 才需要建立公開叫用權限；切成 AWS_IAM 時這兩個 Permission 一併消失。
  IsPublicUrl: !Equals [!Ref FunctionUrlAuthType, NONE]
  HasLLMSecret: !Not [!Equals [!Ref LLMSecretArn, '']]
  UsesBedrock: !Equals [!Ref LLMProvider, bedrock]
  HasNonBedrockSecret: !And
    - !Condition HasLLMSecret
    - !Not [!Condition UsesBedrock]

Resources:
  AgentRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - !If
          - HasNonBedrockSecret
          - PolicyName: ReadLLMSecret
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref LLMSecretArn
          - !Ref AWS::NoValue
        - !If
          - UsesBedrock
          - PolicyName: InvokeConfiguredBedrockModel
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                # Converse authorizes through bedrock:InvokeModel. Scope it to the configured
                # foundation model rather than allowing all Bedrock models or any admin policy.
                - Effect: Allow
                  Action: bedrock:InvokeModel
                  Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}
          - !Ref AWS::NoValue

  # 顯式管理 log group 才能控制保留期。必須先於函式建立並由 AgentFunction DependsOn，
  # 否則 Lambda 會在首次叫用時自己建一個沒有保留期的同名 group，CloudFormation 之後
  # 就會因為「資源已存在」而無法接管。
  AgentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/hoyabit-market-research-agent
      RetentionInDays: !Ref LogRetentionDays

  AgentFunction:
    Type: AWS::Lambda::Function
    DependsOn: AgentLogGroup
    Properties:
      FunctionName: hoyabit-market-research-agent
      ReservedConcurrentExecutions: !Ref ReservedConcurrency
      Runtime: python3.12
      Handler: lambda_handler.handler
      Role: !GetAtt AgentRole.Arn
      # 900s is the Lambda maximum and must exceed the orchestrator's 720s (7+3+2 min) ceiling --
      # at the previous 300s the function was killed mid-run whenever the crawl phase ran long.
      Timeout: 900
      MemorySize: 1024
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          LLM_SECRET_ARN: !Ref LLMSecretArn
          LLM_PROVIDER: !Ref LLMProvider
          GEMINI_MODEL: !Ref GeminiModel
          OPENAI_MODEL: !Ref OpenAIModel
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          # 沒有這一行，雲端的輸出上限就無法調整（見 BedrockMaxTokens 參數的說明）。
          BEDROCK_MAX_TOKENS: !Ref BedrockMaxTokens
          # AWS_REGION is Lambda-reserved; pass the deployed region through a provider-specific
          # variable while llm.py also supports AWS_REGION and AWS_DEFAULT_REGION locally.
          BEDROCK_REGION: !Ref AWS::Region
          # `run_context._code_commit()` 讀這個變數；空字串時它會退回讀 .git（本機）或
          # 回報 unknown（Lambda）。
          CODE_COMMIT: !Ref CodeCommit

  AgentFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt AgentFunction.Arn
      AuthType: !Ref FunctionUrlAuthType
      Cors:
        AllowOrigins: ['*']
        AllowMethods: [GET, POST]
        AllowHeaders: ['content-type']

  AgentFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Condition: IsPublicUrl
    Properties:
      FunctionName: !Ref AgentFunction
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

  AgentFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: IsPublicUrl
    Properties:
      FunctionName: !Ref AgentFunction
      Action: lambda:InvokeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true

Outputs:
  PublicUrl:
    Description: Public HOYA BIT Agent Demo URL
    Value: !GetAtt AgentFunctionUrl.FunctionUrl
