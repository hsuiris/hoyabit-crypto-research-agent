      (1) 語言混雜：`src/llm.py` 的 `build_prompt()` 開頭全英文且沒有輸出語言約束，
          nova-lite 因此回英文 facts／inferences／conclusion，與中文段落標題並存。
          `_CRITIC_PROMPT` 與 `_CLAIM_PROMPT` 原本已要求繁體中文，但分析輸出是英文時
          Critic 會跟著用英文。報告本身也有 14 個英文段落標題。
      (2) Claim 不貼題：`_CLAIM_PROMPT` 沒有規定 statement 必須回答 question。實測
          題目問「現況、驅動因素與風險」，模型回的 CL-001 是「BTC 價格將在未來兩週繼續上漲」
          —— 一個題目沒有要求的價格預測。
      (3) 後續觀察重點複製事實：`observation_points` 在 prompt 裡沒有任何說明，模型直接
          把 facts 的主語搬過來（「BTC's 14-day market return」對上 fact
          「BTC 14-day market return was -1.49%」），該段對讀者沒有增量資訊。
      (4) 下載：`/artifact` 只能在分頁裡「檢視」，沒有 Content-Disposition，也沒有打包，
          評審要拿三份文件得逐檔右鍵另存。
    fix: >-
      1. src/llm.py `build_prompt()` 全面改繁體中文，明確要求「所有文字欄位一律使用繁體中文」
         （幣種代號、指標名稱、Evidence ID 保留原文），並加上 market_judgment／conclusion
         必須直接回答 question、題目沒要求時不得預測價格、observation_points 必須前瞻且
         不得複製 facts。
      2. src/claim_graph.py `_CLAIM_PROMPT` 加入 statement 貼題規則：題目問什麼就答什麼，
         不可改寫成價格預測；多子問題拆成多個 Claim；只有題目要求驗證看法時才用該看法。
      3. src/orchestrator.py 抽出 `_observation_points(evidence, signals)`，並新增
         `_forward_looking_observations()`：以 2-gram 重疊 >= 0.90 且不長於該 fact 判定
         「只是複述」，全部被濾掉才退回 deterministic 版本。過濾結果寫入 execution_log 的
         `llm_reasoning.observation_points_source`（model／model_filtered／deterministic_fallback）。
      4. src/report_renderer.py 14 個英文段落標題改繁體中文；Fact／Inference／Conclusion／
         Claim／Citation Gate 保留英文括註（命題以三層分離為評分主軸，讓評審對得上用語）。
         段落順序完全不變。免責聲明改中文。
      5. src/app.py 介面文字繁中化（研究計畫、任務類型、支持證據、反方證據、推翻條件、
         信心分量、證據可追溯性、執行紀錄、來源類別、內容依據……）；`sec-sub` 的小字英文
         副標刻意保留為輔助標籤。
      6. src/app.py 新增 `/download` 端點與 `build_artifact_zip()`：scope=required 打包命題
         要求的三份（report.md／evidence.json／execution_log.json），scope=all 打包六項並
         含比較執行的兩腳子目錄；`/artifact` 新增 `download=1` 加 Content-Disposition。
         結果頁新增「下載三份提交物（ZIP）」「下載全部產出（ZIP）」按鈕與逐檔檢視／下載表格。
    test_summary: >-
