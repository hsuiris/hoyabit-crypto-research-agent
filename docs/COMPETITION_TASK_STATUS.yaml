  E3.2:
    title: Make the social credibility cap an actual quality judgement
    status: PASS
    depends_on: [E3]
    branch: release/final-4h
    completed_at: 2026-08-02T07:05:00+08:00
    commit: 5dcf2c8
    note: >-
      原始 E0-E4 計畫沒有這個 Task，由使用者指派。與 E3.1 平行開發，兩者檔案零重疊。
      屬缺陷修復，**與 E3 的範圍無關**，只是時序上落在 E3 之後。
    root_cause: >-
      `anonymous_or_low_trace_social`（上限 0.35）宣稱處理「匿名或低可追溯帳號」，但判斷只是
      「post dict 裡有沒有 author 這個鍵」，而 `_metadata_scopes()` 會下探 `content` → `posts`
      逐則展開、`_find_key()` 找到第一個就 return。實測三個問題：
      (1) 一則署名替 24 則匿名擔保 —— 只有 1/25 則有作者時 cap 完全解除；
      (2) 作者集中度不可見 —— 同一帳號刷 25 則與 25 個不同帳號各發一則分數一模一樣
          （`independence` 只被 news lineage 稀釋，社群沒有等價機制）；
      (3) cap 本身幾乎是 no-op —— `social_public` 的 raw score 就是 0.3875，cap 只扣 0.0375。
    fix: >-
      1. `src/day2_sources.py` 新增 `social_account_trace()`：覆蓋率、不同帳號數、單一帳號
         佔比、profile locator 計數。三平台各讀自己真正提供的欄位（Reddit／HN `author`、
         Bluesky `author_handle`），不互相冒充，不以 `fetched_at` 或 feed 名稱代填作者。
         分母是通過相關性過濾後實際採用的貼文。純計數，不做方向性判斷。
      2. `src/credibility.py` 的 cap 改讀這些統計；門檻寫在
         `config/source_registry.json` 的 `social_public.account_trace_thresholds`
         （覆蓋率 0.80、單一帳號佔比 0.50、最少 3 個不同帳號、需有 profile locator）。
         沒有統計欄位的舊資料退回原本的作者鍵檢查並在 notes 明講，不無聲放行也不無聲觸發。
      3. 把集中度回饋到 `independence`（比照 news lineage 的 `independence_base / divisor`
         與同一個 `INDEPENDENCE_FLOOR`），匿名貼文併成一個無法辨識的來源而非各算一個獨立
         聲音。這一步是必要的：光改觸發條件只值 0.0375。
    measured_before_after: |
      情境                      修復前 final / cap        修復後 final / independence / cap
      25 則全部匿名              0.3500 / 生效             0.3475 / 0.0500 / 生效
      只有 1/25 則有作者         0.3875 / 無               0.3475 / 0.0500 / 生效
      同一帳號刷 25 則           0.3875 / 無               0.3475 / 0.0500 / 生效
      25 個不同作者              0.3875 / 無               0.3875 / 0.4500 / 無
    small_sample_behaviour: >-
      漸進降級，非二元：1 則或 2 則（不同作者 < 3）套 cap 0.3500；3 則／3 作者放行 0.3875；
      5 則／4 作者（一人發兩則）輕微稀釋至 0.3785 且不套 cap。T8.6 記錄的相關性過濾很兇
      （HN BNB 濾掉 24/25），因此雲端會實際遇到小樣本被 cap 的情況。
    scope_containment_verified: >-
      協調端把 HEAD 版 `credibility.py` 與舊 registry 載進獨立路徑逐項比對：market_api／
      major_media／blockchain_raw／derivatives_api／macro_api／local_csv／
      official_announcement 七個 source_type 的 final_score、independence、
      independence_factor 與 score_limiters **全部逐項相同**。變更完全侷限在社群。
    reverse_verified: >-
      只還原行為（保留常數，把 `_hard_caps` 社群區塊改回鍵存在檢查、`divisor = size`）後
      10 failed，訊息如 `'anonymous_or_low_trace_social' not found in []` 與 `0.45 != 0.05`。
    artifacts:
      - src/day2_sources.py
      - src/credibility.py
      - config/source_registry.json
      - tests/test_social_account_trace.py
      - tests/test_credibility.py
      - tests/test_social_sources.py
    test_summary: >-
      新增 37 個測試。
      完整套件（含 E3.1）：python3 -m unittest discover -s tests → 927 passed, 0 failed,
      0 errors（E3 後為 847）。compileall OK；循環 import 檢查 OK；
      --dry-run 30 檔 444 KB；secret scan 乾淨；git diff --check 乾淨。
      整合驗證：五幣 offline E2E 六檔齊備、gate 皆 PASS、manifest hash 全相符；
      E3 的 `/report` 仍渲染正常（77 KB、三報告在、無 `<script>`）；首頁仍無 formal 選項；
      `/download?scope=all` 仍回 ZIP；本機 Web `GET /` 200 且含 HOYA BIT。
      Offline fallback 未受影響：離線仍 9 筆 fixture、最高 0.20、limiters 不變。
    blockers: []
    known_limitations:
      - >-
        **這不是機器人或假帳號偵測。** 只量測帳號可追溯性與聲量集中度，不判斷帳號真偽，
        也不宣稱能識別協同帳號
      - >-
        無法取得帳號年齡與發文歷史。Reddit 子版 feed、Bluesky public search、HN Algolia
        都不提供；硬做會需要額外 API 呼叫並產生假精度，因此明確不做
      - 同一人操作多個帳號、或多帳號轉貼同一內容，在本統計中仍看起來像多個獨立聲音
      - >-
        `profile_locator` 只證明連結指向該帳號頁，不證明帳號真實存在或活躍（未做連結解析）
      - >-
        覆蓋率 0.80／集中度 0.50／最少 3 個帳號是工程判斷的門檻，不是統計檢定；
        門檻寫在 config，可調整而不動程式
      - >-
        舊資料（手寫測試資料、離線 fixture）沿用舊檢查，因此「一則署名解除整筆」在那條路徑上
        仍存在 —— 這是刻意保留既有行為，並在 notes 標明
      - >-
        `independence_factor` 對社群證據不再恆為 1.0，因此 E2 的
        `effective_weight = reliability × relevance × independence_factor` 會反映集中度。
        非社群來源已逐項確認未變

