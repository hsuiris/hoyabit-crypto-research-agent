    fix: >-
      1. lambda_handler.py 新增 `/download`（scope=required｜all）與 `/artifact`
         （path、download=1）兩條 GET 路由，共用 `src.app.build_artifact_zip()` 與
         `DOWNLOADABLE_NAMES`，不重複實作打包與白名單邏輯。
         ZIP 以 base64 回傳並設 `isBase64Encoded=True` —— 少了這個旗標，Function URL 會把
         二進位當文字送出，下載到的檔案會損毀，而瀏覽器不會報錯。
         產物寫在容器 `/tmp`，只有處理過該次執行的容器讀得到；找不到 run 時回 404 並說明
         這個限制，而不是回一個空 ZIP 讓人以為執行沒有產物。
      2. 結果頁（Lambda 版的 HTML 另外組）加上兩個 ZIP 按鈕與六個逐檔下載連結，連結一律
