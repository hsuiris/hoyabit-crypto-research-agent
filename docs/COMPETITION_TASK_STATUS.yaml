  E2.6:
    title: Raise the Bedrock output cap so long analyses stop truncating
    status: PASS
    depends_on: [E2.5]
    branch: release/final-4h
    completed_at: 2026-08-02T06:05:00+08:00
    commit: 3ce524d
    note: >-
      原始 E0-E4 計畫沒有這個 Task，由使用者指派。屬缺陷修復，不新增功能。
    root_cause: >-
      `BEDROCK_MAX_TOKENS` 預設寫死 2048，而 `aws/template.yaml` 的 Lambda 環境變數裡沒有這個
      變數、`.env` 也不進部署包 —— 因此雲端只能吃程式內建預設值，完全沒有調整途徑。
      同時 E2 把每筆 Evidence 的語意評估併進**同一次**分析回應：實測雲端 analyst 輸出約
      1,000 字中文（約 1,100–1,500 tokens，見 demo-fixtures/competition-ready/live-success/），
      再加 13 筆評估後很容易超過 2048。
      超過時 Converse 不會報錯，而是回 `stopReason=max_tokens` 並把 JSON 截在一半，於是
      `json.loads()` 的訊息與已修好的 markdown fence bug 一模一樣；更糟的是既有重試會把整份
      JSON Schema 附在 prompt 後面，讓輸出要求**更長**，第二次保證再被截，整份分析降級成離線推理。
    fix: >-
      1. `aws/template.yaml` 新增 `BedrockMaxTokens` 參數（預設 5000、範圍 512–5000，對齊
         amazon.nova-lite-v1:0 的文件輸出上限）與 `BEDROCK_MAX_TOKENS: !Ref BedrockMaxTokens`
         環境變數。後者才是雲端能不能調整的關鍵。
      2. `aws/deploy.sh` 新增 `--max-tokens`，讀 `DEPLOY_BEDROCK_MAX_TOKENS` 而非執行期的
         `BEDROCK_MAX_TOKENS`（本機 .env 不該決定雲端部署什麼），並在打包前攔下非數字。
      3. `src/llm.py`：程式內建預設 2048 → 4096；新增 `stopReason == max_tokens` 偵測，錯誤
         訊息指名當時的上限與 stopReason；截斷與格式錯誤改走**相反**的重試策略 —— 截斷要求縮短
         且不附 schema，並明確允許捨棄 `evidence_assessments` 與 `claims`（兩者都不在
         `ANALYSIS_SCHEMA["required"]`），因此最壞情況是那兩層走 deterministic fallback，
         敘事仍由模型撰寫。
    reverse_verified: >-
      以 HEAD 版 `_generate_bedrock` 餵一個截斷回應，舊行為的錯誤訊息是
      `Unterminated string starting at: line 1 column 13 (char 12)`（看不出是撞到上限），
      maxTokens 為 2048，且重試 prompt 由 275 字元加長到 342（附上 schema）。
    artifacts:
      - src/llm.py
      - aws/template.yaml
      - aws/deploy.sh
      - .env.example
      - tests/test_bedrock_output_cap.py
    test_summary: >-
      targeted：tests/test_bedrock_output_cap.py 25 tests OK。
      完整套件：python3 -m unittest discover -s tests → 816 passed, 0 failed（E2.5 後為 791）。
      compileall OK；bash -n aws/deploy.sh OK；--dry-run 425 KB；
      `--max-tokens abc` 正確以退出碼 2 擋下；離線端到端 gate PASS 六檔齊備。
    blockers: []
    known_limitations:
      - >-
        **不是解除上限。** amazon.nova-lite-v1:0 的硬上限是 5,000 output tokens，超過必定截斷；
        本 Task 只是把 2048 拉到模型允許範圍內，並讓截斷可診斷、重試策略正確
      - >-
        上限拉高後模型會生成更多字，analyst 那一段預估由 20 秒增至 50–60 秒，整趟由 47 秒
        增至 60–95 秒（仍遠低於命題 900 秒上限）
      - 未部署，因此雲端仍吃 2048；下次部署後才生效
      - 未執行真實 Bedrock 呼叫（延續既有慣例，模型端一律 mock）

