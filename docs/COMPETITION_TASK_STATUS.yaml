    # 一個 Task 一個 commit，無法在該 commit 內寫入自己的 hash；實際 hash 見
    # `git log --grep "fix(T8.1)"`。
    commit: 'fix(T8.1): map plan domains to the claim vocabulary and verify deployment'
    note: >-
      原始 T0-T8 計畫沒有這個 Task。起因是比對主辦方命題文件時，實測發現正式部署上每個
      Claim 都被判成 insufficient_evidence，而報告與 Citation Gate 都不會顯示任何異常。
      根因不是證據不足，是 domain 詞彙表在兩端分岔。屬缺陷修復，不新增功能，不擴大範圍。
    root_cause: >-
      `required_domains` 由 Planner 產出、由 claim_graph 當 domain_coverage 的分母，
      兩端各自維護詞彙表且沒有共用契約，於是有兩條靜默歸零的路徑：
      (1) LLM 用自由字串填 required_domains。正式部署（us-west-2／amazon.nova-lite-v1:0）
          實際回傳 market_data／news_events／social_sentiment／technical_analysis，與
          claim_graph 的 market／news／social／onchain／derivatives／macro 交集為空。
      (2) 即使詞彙表對上，`covered` 只取「證據 domain ∩ plan domain」，因此 plan 沒列到的
          領域即使真的有證據也一分不算（實測：plan 要 market/news/social，Claim 唯一支持
          證據是 chain TVL → onchain，coverage 仍是 0/3）。
      兩者都讓 coverage < MIN_DOMAIN_COVERAGE，強制 verdict = insufficient_evidence。
      沒有 error、沒有 warning、Citation Gate 仍 PASS —— 報告只會說「資料不足」。
      Planner 的 deterministic fallback 另有同類問題：`announcement`／`whale` 不是 domain
      （分別歸 news／onchain），因此永遠無法被覆蓋。
    fix: >-
      1. src/schemas.py 新增 CLAIM_DOMAINS（domain 字面值的唯一定義來源）、DOMAIN_ALIASES
         與 normalise_domains()。比對前先收斂大小寫與分隔符，因此 on-chain／On Chain／
         ONCHAIN 命中同一個鍵。
      2. src/planner.py：LLM schema 的 required_domains 加 enum、prompt 明列 allowed_domains、
         解析與 fallback 都經 normalise_domains()，因此落地的 research_plan.json 已是 canonical。
         刻意不因為模型用了近義詞就作廢整份 plan（plan 其餘部分仍可用）。
      3. src/claim_graph.py：取交集前正規化；分母改為「plan 領域 ∪ 本 Claim 證據實際覆蓋的
         領域」；plan 領域完全無法對應時退回 DEFAULT_REQUIRED_DOMAINS 並記 limiter
         plan_domains_unrecognised。未知 data_type 的 `other` 不進分母也不進分子。
      4. aws/：deploy.sh 計算並注入 CODE_COMMIT（工作區不乾淨時加 -dirty），template.yaml
         新增 CodeCommit parameter 與 Lambda 環境變數，manifest.json 的 code_commit 因此
         不再是 unknown；新增 aws/verify-deployment.sh，不需 AWS 憑證即可確認線上狀態。
    test_summary: >-
      targeted：python3 -m unittest tests.test_claim_domain_vocabulary -v → 24 tests OK。
      回歸：python3 -m unittest tests.test_claim_graph tests.test_planner
      tests.test_schema_contract tests.test_t2_planner_wiring tests.test_t4_claim_graph_wiring
      → 158 tests OK（既有斷言全部未修改）。
      完整套件：python3 -m unittest discover -s tests → 611 tests, 611 passed, 0 failed, 0 errors
      （修改前 587）。
      Offline E2E：BTC／ETH／SOL／BNB／XRP 各產出六檔、Citation Gate PASS、coverage 0.6667。
      以 git stash 對照確認 offline 行為完全未變（修改前後皆 0.6667）：這個缺陷只出現在
      LLM 產生 plan 的路徑，離線備援從未受影響。
      Before/after 對照（同一組 live collector、同一個模型 plan 形狀、注入 planner client）：
      修改前 domain_coverage=0.0／verdict=insufficient_evidence／信心 0.35；
      修改後 domain_coverage=0.4／verdict=mixed／信心 0.5963；Citation Gate 皆 PASS。
      CODE_COMMIT：以 env var 注入後 manifest.code_commit 正確帶出注入值。
      部署：bash aws/deploy.sh --dry-run → 29 檔／385 KB；bash -n 兩支腳本語法 OK。
      線上驗證：./aws/verify-deployment.sh --run → 首頁 HTTP 200（0.55s）、五幣可選、
